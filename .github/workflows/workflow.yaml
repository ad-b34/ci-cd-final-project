name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f product-details/requirements.txt ]; then pip install -r product-details/requirements.txt; fi

    - name: Lint with flake8
      run: |
        flake8 product-details --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 product-details --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run unit tests
      run: |
        cd product-details
        python -m unittest discover -s . -p "*.py"
